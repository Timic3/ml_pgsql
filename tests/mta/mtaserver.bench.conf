<config>
    <servername>ml_pgsql bench</servername>
    <serverip>auto</serverip>
    <serverport>22003</serverport>
    <maxplayers>32</maxplayers>
    <httpport>22005</httpport>
    <httpserver>1</httpserver>
    <ase>0</ase>
    <donotbroadcastlan>1</donotbroadcastlan>
    <password></password>
    <idfile>server-id.keys</idfile>
    <logfile>logs/server.log</logfile>
    <authfile>logs/server_auth.log</authfile>
    <dbfile>logs/db.log</dbfile>
    <acl>acl.xml</acl>
    <scriptdebuglogfile>logs/scripts.log</scriptdebuglogfile>
    <scriptdebugloglevel>3</scriptdebugloglevel>
    <htmldebuglevel>0</htmldebuglevel>
    <filter_duplicate_log_lines>0</filter_duplicate_log_lines>
    <fpslimit>36</fpslimit>
    <voice>0</voice>
    <backup_path>backups</backup_path>
    <backup_interval>0</backup_interval>
    <crash_dump_upload>0</crash_dump_upload>
    <database_credentials_protection>0</database_credentials_protection>
    <module src="ml_pgsql.so"/>
    <resource src="pgbench" startup="1" protected="0"/>
</config>
